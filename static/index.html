<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gates of Babylon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M4 6C4 6 10 6 13 9C16 12 16 15 13 18C10 21 4 21 4 21" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="17.5" cy="13.5" r="2.5" fill="#38bdf8"/>
              <line x1="20" y1="13.5" x2="23" y2="13.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="logo-title">Gates of Babylon</span>
        </div>
      </div>

      <div class="header-right">
        <button id="btnTruthTable" class="btn btn-primary" title="Generate Truth Table">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          Truth Table
        </button>
        <button id="btnClear" class="btn btn-ghost text-danger" title="Clear Canvas">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Component Palette -->
      <aside class="palette">
        <div class="palette-section">
          <div class="section-title">Inputs</div>
          <div class="palette-items">
            <div class="palette-card" draggable="true" data-type="input" title="Drag to add an Input Pin (Click to toggle 0 / 1)">
              <div class="card-icon pin-icon in-icon">0</div>
              <div class="card-name">Input Pin</div>
            </div>
          </div>
        </div>

        <div class="palette-section">
          <div class="section-title">Logic Gates</div>
          <div class="palette-items">
            <!-- NOT -->
            <div class="palette-card" draggable="true" data-type="gate" data-gate-type="1" title="NOT Gate">
              <div class="card-icon">
                <svg width="36" height="22" viewBox="0 0 54 32">
                  <polygon points="8,4 38,16 8,28" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                  <circle cx="43" cy="16" r="3.5" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                </svg>
              </div>
              <div class="card-name">NOT</div>
            </div>

            <!-- AND -->
            <div class="palette-card" draggable="true" data-type="gate" data-gate-type="2" title="AND Gate">
              <div class="card-icon">
                <svg width="36" height="22" viewBox="0 0 54 32">
                  <path d="M8,4 L26,4 C36,4 44,9.5 44,16 C44,22.5 36,28 26,28 L8,28 Z" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                </svg>
              </div>
              <div class="card-name">AND</div>
            </div>

            <!-- OR -->
            <div class="palette-card" draggable="true" data-type="gate" data-gate-type="3" title="OR Gate">
              <div class="card-icon">
                <svg width="36" height="22" viewBox="0 0 54 32">
                  <path d="M8,4 Q20,16 8,28 Q30,28 44,16 Q30,4 8,4 Z" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                </svg>
              </div>
              <div class="card-name">OR</div>
            </div>

            <!-- NAND -->
            <div class="palette-card" draggable="true" data-type="gate" data-gate-type="4" title="NAND Gate">
              <div class="card-icon">
                <svg width="38" height="22" viewBox="0 0 58 32">
                  <path d="M8,4 L24,4 C34,4 40,9.5 40,16 C40,22.5 34,28 24,28 L8,28 Z" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                  <circle cx="45" cy="16" r="3.5" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                </svg>
              </div>
              <div class="card-name">NAND</div>
            </div>

            <!-- NOR -->
            <div class="palette-card" draggable="true" data-type="gate" data-gate-type="5" title="NOR Gate">
              <div class="card-icon">
                <svg width="38" height="22" viewBox="0 0 58 32">
                  <path d="M8,4 Q18,16 8,28 Q28,28 40,16 Q28,4 8,4 Z" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                  <circle cx="45" cy="16" r="3.5" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                </svg>
              </div>
              <div class="card-name">NOR</div>
            </div>

            <!-- XOR -->
            <div class="palette-card" draggable="true" data-type="gate" data-gate-type="6" title="XOR Gate">
              <div class="card-icon">
                <svg width="38" height="22" viewBox="0 0 58 32">
                  <path d="M5,4 Q17,16 5,28" fill="none" stroke="#d4d4d8" stroke-width="2"/>
                  <path d="M11,4 Q21,16 11,28 Q32,28 45,16 Q32,4 11,4 Z" fill="#18181b" stroke="#d4d4d8" stroke-width="2"/>
                </svg>
              </div>
              <div class="card-name">XOR</div>
            </div>
          </div>
        </div>

        <div class="palette-section">
          <div class="section-title">Outputs</div>
          <div class="palette-items">
            <div class="palette-card" draggable="true" data-type="output" title="Drag to add an Output Pin">
              <div class="card-icon pin-icon out-icon">Out</div>
              <div class="card-name">Output Pin</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Canvas -->
      <main class="canvas-wrapper" id="canvasWrapper">
        <div class="canvas-grid" id="circuitCanvas">
          <svg id="wireLayer" class="wire-layer" width="3000" height="3000"></svg>
          <div id="nodesContainer" class="nodes-container"></div>
        </div>

        <!-- Floating Controls -->
        <div class="canvas-controls">
          <button id="btnZoomIn" class="btn-icon" title="Zoom In">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <span id="zoomLevel">100%</span>
          <button id="btnZoomOut" class="btn-icon" title="Zoom Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <div class="controls-divider"></div>
          <button id="btnFitView" class="btn-icon" title="Reset View">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><polyline points="21 15 21 21 15 21"/><polyline points="3 9 3 3 9 3"/></svg>
          </button>
          <button id="btnDeleteSelected" class="btn-icon text-danger" title="Delete Selected (Del/Backspace)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </main>
    </div>

    <!-- Truth Table Modal -->
    <div class="modal-backdrop hidden" id="truthTableModal">
      <div class="modal-window">
        <div class="modal-header">
          <div class="modal-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
            <h3>Truth Table</h3>
          </div>
          <div class="modal-actions">
            <button id="btnCopyTable" class="btn btn-secondary btn-sm">Copy Table</button>
            <button id="btnCloseModal" class="btn-icon-sm">&times;</button>
          </div>
        </div>

        <div class="modal-body">
          <div id="truthTableSummary" class="table-summary"></div>
          <div class="table-container" id="truthTableContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
